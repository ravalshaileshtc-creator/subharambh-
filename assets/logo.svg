<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="url(#auraGlow)"/>

  <!-- Ornate Decorative Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Royal Arch / Mandap Dome Canopy -->
  <path d="M 160 270 C 160 170, 352 170, 352 270 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <path d="M 180 270 C 180 195, 332 195, 332 270 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>

  <!-- Royal Kalash / Lotus Centerpiece -->
  <path d="M 256 120 L 264 138 L 284 138 L 268 150 L 274 168 L 256 156 L 238 168 L 244 150 L 228 138 L 248 138 Z" fill="url(#goldGrad)"/>
  
  <!-- Sacred Diya / Flame Motif -->
  <path d="M 256 175 C 244 195, 240 205, 240 215 C 240 225, 247 232, 256 232 C 265 232, 272 225, 272 215 C 272 205, 268 195, 256 175 Z" fill="#fef08a"/>
  <path d="M 230 230 C 230 246, 282 246, 282 230 Z" fill="url(#goldGrad)"/>

  <!-- Interlocking Royal Wedding Rings (Gathbandhan) -->
  <circle cx="240" cy="285" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="272" cy="285" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <!-- Diamond Sparkle on Ring -->
  <polygon points="272,252 277,243 286,243 279,258 272,252" fill="#ffffff"/>

  <!-- Decorative Garland / Toran Swag -->
  <path d="M 150 270 Q 200 300 256 295 Q 312 300 362 270" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="170" cy="285" r="5" fill="#fef08a"/>
  <circle cx="205" cy="295" r="6" fill="#fef08a"/>
  <circle cx="256" cy="298" r="7" fill="#fef08a"/>
  <circle cx="307" cy="295" r="6" fill="#fef08a"/>
  <circle cx="342" cy="285" r="5" fill="#fef08a"/>

  <!-- Brand Typography -->
  <text x="256" y="360" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PANCHMAHAL</text>
  <text x="256" y="392" font-family="'Cinzel', 'Montserrat', sans-serif" font-size="20" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">EVENTS HUB</text>
  
  <!-- Subtitle Ribbon -->
  <rect x="136" y="415" width="240" height="26" rx="13" fill="#451a03" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="256" y="433" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="2">GODHRA • GUJARAT</text>

  <!-- Sparkles -->
  <text x="120" y="220" font-size="20" fill="#fef08a">✨</text>
  <text x="372" y="220" font-size="20" fill="#fef08a">✨</text>
</svg>
